<!doctype html>
<!-- Elysa's Secret — Nordic AI Cup 2026.
     Content lives in SITE_CONFIG (data: scores, names, dates) and
     i18n.js (all prose, EN + DA). Never hard-code copy in this file. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elysa's Secret</title>
    <meta name="description" content="Nordic AI Cup 2026 — 1st place, Denmark. Four first-year students from the University of Southern Denmark." />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body id="top">
    <!-- Set before anything paints, so the page never flashes its content
         before the terminal has run. With JS off this line never executes, no
         class is added, and the whole page is simply visible. -->
    <script>document.documentElement.classList.add("is-booting");</script>

    <!-- ============================================================
         BOOT TERMINAL — owns the entire viewport until it finishes, then
         slides up and out like terminal output scrolling away. Hidden by
         default in CSS so that with JS disabled it can never cover the page.
         aria-hidden: it is theatre, not content, and nobody should have to
         sit through it with a screen reader.
         ============================================================ -->
    <div class="boot" data-slot="boot" aria-hidden="true">
      <div class="boot__screen">
        <ol class="boot__log" data-slot="boot-log"></ol>
        <p class="boot__ready" data-slot="boot-ready"></p>
      </div>
    </div>

        brand: { name: "Elysa's Secret", logo: "" },

           spec's allowlist by check.js. */

           validation run from the graded evaluation. Never merge them: the
           whole point of this section is that they are different numbers. */

          tasks: [
            {
              id: "survival",
              tabKey: "run.tabSurvival",

                { value: 1239, kind: "local",      labelKey: "run.s6", noteKey: "run.s6n" },
                { value: 1484, kind: "local",      labelKey: "run.s7", noteKey: "run.s7n" },

              evaluated: { value: "1405.256", key: "run.evaluated", noteKey: "run.survivalEvalNote" }

            {
              id: "drone",
              tabKey: "run.tabDrone",
              subKey: "run.droneSub",
              points: [
                { value: 0.5841, kind: "validation", labelKey: "run.d1", noteKey: "run.d1n" },
                { value: 0.2630, kind: "evaluated",  labelKey: "run.d2", noteKey: "run.d2n" }

              evaluated: null

            {
              id: "medical",
              tabKey: "run.tabMedical",
              subKey: "run.medicalSub",

                { value: 0.802,  kind: "validation", labelKey: "run.m1", noteKey: "run.m1n" },
                { value: 0.8308, kind: "validation", labelKey: "run.m2", noteKey: "run.m2n" }

        boot: {
          commands: ["elysa --status", "elysa --whoami", "elysa --run"],
          steps: [
            { labelKey: "boot.l1", statusKey: "boot.s1" },
            { labelKey: "boot.l2", statusKey: "boot.s2" },
            { labelKey: "boot.l3", statusKey: "boot.s3" }

            { key: "about.loop.idea" }, { key: "about.loop.implement" },
            { key: "about.loop.run" }, { key: "about.loop.wait" },
            { key: "about.loop.score" }, { key: "about.loop.analyze" },
            { key: "about.loop.change" }
          ]
        },

        learned: {
          cards: [
            { icon: "gear", titleKey: "learned.1.title", textKey: "learned.1.text" },
            { icon: "chart", titleKey: "learned.2.title", textKey: "learned.2.text" },
            { icon: "check", titleKey: "learned.3.title", textKey: "learned.3.text" },
            { icon: "shield", titleKey: "learned.4.title", textKey: "learned.4.text" },
            { icon: "zap", titleKey: "learned.5.title", textKey: "learned.5.text" },
            { icon: "eye", titleKey: "learned.6.title", textKey: "learned.6.text" }
          ]
        },

        contact: {
          email: "hello@elysasecret.com",
          fields: ["name", "email", "message", "consent"],
          endpoint: ""
        },

        /* Empty hrefs are skipped by the renderer rather than shipped as dead
           links — add the URLs and the icons appear on the next load. */

          socials: [
            { name: "Instagram", href: "", icon: "instagram" },
            { name: "LinkedIn", href: "", icon: "linkedin" },

    <a class="skip-link" href="#main">Skip to content</a>

    <!-- ============================================================
         SLOT: status rail — pinned, always visible, real state
         ============================================================ -->
    <!-- rail + header share one sticky container: the rail wraps on narrow
         screens, so sticking them independently would let them overlap -->
    <div class="topbar">
    <div class="rail" data-slot="rail">
      <div class="rail__inner container">
        <span class="rail__items" data-fill="rail.items"></span>
        <span class="rail__right">
          <span class="rail__countdown" data-slot="countdown"></span>
          <span class="lang" role="group" aria-label="Language">
            <button type="button" class="lang__btn" data-lang="en" aria-pressed="true">EN</button>
            <button type="button" class="lang__btn" data-lang="da" aria-pressed="false">DA</button>
          </span>
        </span>
      </div>
    </div>

    <header class="site-header" data-slot="header">
      <div class="container site-header__inner">
        <a class="site-header__brand" href="#top" data-close-menu>
          <span class="site-header__logo" data-fill="brand.logo"></span>
          <span class="site-header__name" data-fill="brand.name"></span>
        </a>
        <nav class="site-header__nav" aria-label="Main navigation" data-fill="nav.links"></nav>
        <span class="site-header__cta" data-fill="nav.cta"></span>
        <button class="site-header__toggle" type="button" data-slot="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
          <span class="site-header__toggle-bar"></span>
          <span class="site-header__toggle-bar"></span>
          <span class="site-header__toggle-bar"></span>
        </button>
      </div>
    </header>
    </div>

    <main id="main">
      <!-- SLOT: hero — the boot sequence -->
      <section id="hero" class="section section--hero" data-section="hero">
        <div class="container hero__inner">
          <h1 class="hero__headline" data-slot="headline" data-fill="hero.headline"></h1>
          <p class="hero__sub" data-fill="hero.sub"></p>
          <dl class="hero__stats" data-fill="hero.stats"></dl>
          <div class="hero__ctas" data-fill="hero.ctas"></div>
        </div>
      </section>

      <!-- SLOT: team — four panes, no photographs -->
      <section id="team" class="section section--team" data-section="team">
        <div class="container">
          <div class="section__heading">
            <h2 class="section__title" data-fill="team.heading"></h2>
            <p class="section__sub" data-fill="team.sub"></p>
          </div>
          <div class="team__grid" data-fill="team.members"></div>
        </div>
      </section>

      <!-- SLOT: board — two leaderboards, tabbed -->
      <section id="board" class="section section--board" data-section="board">
        <div class="container">
          <div class="section__heading">
            <h2 class="section__title" data-fill="board.heading"></h2>
            <p class="section__sub" data-fill="board.sub"></p>
          </div>
          <div class="board__tabs" role="tablist" aria-label="Leaderboard" data-slot="board-tabs"></div>
          <div class="board__mount" data-slot="board-table"></div>
          <p class="board__gap" data-slot="board-gap" hidden></p>
        </div>
      </section>

      <!-- SLOT: run — the animated score curve -->
      <section id="run" class="section section--run" data-section="run">
        <div class="container">
          <div class="section__heading">
            <h2 class="section__title" data-fill="run.heading"></h2>
            <p class="section__sub" data-fill="run.sub"></p>
          </div>
          <div class="board__tabs run__tabs" role="tablist" aria-label="Task" data-slot="run-tabs" hidden></div>
          <figure class="run__figure">
            <p class="run__task-sub" data-slot="run-task-sub"></p>
            <svg class="run__svg" data-slot="run-svg" viewBox="0 0 800 360" role="img" aria-labelledby="run-svg-title run-svg-desc" preserveAspectRatio="xMidYMid meet">
              <title id="run-svg-title"></title>
              <desc id="run-svg-desc"></desc>
            </svg>
            <ol class="run__legend" data-slot="run-legend"></ol>
            <figcaption class="run__caption" data-slot="run-caption"></figcaption>
          </figure>
          <div class="run__closing" data-slot="run-closing"></div>
        </div>
      </section>

      <!-- SLOT: about — how we work -->
      <section id="about" class="section section--about" data-section="about">
        <div class="container">
          <div class="section__heading">
            <h2 class="section__title" data-fill="about.heading"></h2>
          </div>
          <ol class="loop" data-fill="about.loop"></ol>
          <div class="about__text" data-fill="about.text"></div>
        </div>
      </section>

      <!-- SLOT: learned — five principles -->
      <section id="learned" class="section section--learned" data-section="learned">
        <div class="container">
          <div class="section__heading">
            <h2 class="section__title" data-fill="learned.heading"></h2>
            <p class="section__sub" data-fill="learned.sub"></p>
          </div>
          <div class="features__grid" data-fill="learned.cards"></div>
        </div>
      </section>

      <!-- SLOT: contact — two doors + form -->
      <section id="contact" class="section section--contact" data-section="contact">
        <div class="container">
          <div class="section__heading">
            <h2 class="section__title" data-fill="contact.heading"></h2>
            <p class="section__sub" data-fill="contact.sub"></p>
          </div>
          <div class="contact__inner">
            <div class="contact__info" data-fill="contact.info"></div>
            <form class="contact__form" data-slot="contact-form" data-fill="contact.fields" novalidate>
              <!-- fields injected by script.js from config.contact.fields -->
            </form>
          </div>
        </div>
      </section>
    </main>

    <!-- ============================================================
         SLOT: footer
         ============================================================ -->
    <footer class="site-footer" data-slot="footer">
      <div class="container">
        <div class="footer__grid">
          <div class="footer__brand">
            <a class="footer__logo" href="#top">
              <span class="site-header__logo" data-fill="brand.logo"></span>
              <span class="site-header__name" data-fill="brand.name"></span>
            </a>
            <p class="footer__tagline" data-fill="footer.tagline"></p>
          </div>
          <div class="footer__socials" data-fill="footer.socials"></div>
        </div>
        <div class="footer__bottom">
          <p data-fill="footer.legal"></p>
        </div>
      </div>
    </footer>

    <!-- ============================================================
         MASCOT — arrives centre-screen after the boot sequence, then travels
         to the bottom-right corner under its own steam. Draggable, with
         expressions. Decorative: aria-hidden, and the drag affordance is
         mouse/touch only, so keyboard users are never blocked by it.
         ============================================================ -->
    <div class="mascot" data-slot="mascot" aria-hidden="true">
      <svg class="mascot__svg" viewBox="0 0 120 106" focusable="false">
        <defs>
          <!-- fractal noise displacement: this is what gives the body its
               organic, breathing surface instead of a flat vector shape.
               `scale` is driven from JS so it can be switched off for
               reduced-motion users. -->
          <filter id="mascot-goo" x="-40%" y="-40%" width="180%" height="180%">
            <feTurbulence type="fractalNoise" baseFrequency="0.015 0.022" numOctaves="2" seed="7" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" data-slot="mascot-displace"
              scale="0" xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </defs>
        <g class="mascot__inner" filter="url(#mascot-goo)">
          <path class="mascot__body" d="M32 10 H88 Q94 10 94 16 V32 H104 Q110 32 110 38 V52 Q110 58 104 58 H94 V72 H93 V93 Q93 96 90 96 H85 Q82 96 82 93 V72 H75 V93 Q75 96 72 96 H67 Q64 96 64 93 V72 H57 V93 Q57 96 54 96 H49 Q46 96 46 93 V72 H39 V93 Q39 96 36 96 H31 Q28 96 28 93 V72 H26 V58 H16 Q10 58 10 52 V38 Q10 32 16 32 H26 V16 Q26 10 32 10 Z" />
          <g class="mascot__eyes">
            <path class="mascot__eye" d="M43 34 L56 41 L43 48 Z" />
            <path class="mascot__eye" d="M77 34 L64 41 L77 48 Z" />
          </g>
        </g>
      </svg>
    </div>

    <script src="i18n.js"></script>
    <!-- motion.js defines window.SiteMotion, which script.js's boot() consumes.
         It must load first, or the boot has to guard for a missing API. -->
    <script src="motion.js"></script>
    <script src="script.js"></script>
  </body>
</html>
