<!doctype html>
<!-- Where the contact form sends people after a successful submission. Kept
     deliberately tiny: it is a utility page, not part of the site.

     English only, even though the site itself is bilingual — the form service
     redirects here without carrying the visitor's language, and a wrapper that
     guessed would be worse than one plain sentence. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Message sent — Elysa's Secret</title>
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="thanks">
      <p class="thanks__prompt"><span aria-hidden="true">$</span> elysa --contact</p>
      <h1 class="thanks__title">Message sent.</h1>
      <p class="thanks__text">
        Thank you — we will get back to you. If it is about the final in
        Reykjavík, say so and we will answer faster.
      </p>
      <a class="btn btn--primary thanks__back" href="index.html">Back to the site</a>
    </main>
  </body>
</html>
