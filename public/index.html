<!doctype html>
<!-- Elysa's Secret: the team and every hackathon we have entered.
     Data lives in config.js, all prose (EN + DA) in i18n.js, and the top bar,
     footer and mascot in chrome.js. Never hard-code copy in this file. -->
<html lang="en" data-page="home">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elysa's Secret</title>
    <meta name="description" content="Elysa's Secret, a hackathon team from the University of Southern Denmark. 1st in Denmark at the Nordic AI Cup 2026 and 1st place at HyperBloom October 2026." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/x-icon" href="./images/KikasLogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body id="top">
    <!-- Set before anything paints, so the page never flashes its content
         before the terminal has run. With JS off this line never executes, no
         class is added, and the whole page is simply visible. -->
    <script>document.documentElement.classList.add("is-booting");</script>

    <!-- ============================================================
         BOOT TERMINAL — owns the entire viewport until it finishes, then
         slides up and out like terminal output scrolling away. Hidden by
         default in CSS so that with JS disabled it can never cover the page.
         aria-hidden: it is theatre, not content, and nobody should have to
         sit through it with a screen reader.
         ============================================================ -->
    <div class="boot" data-slot="boot" aria-hidden="true">
      <div class="boot__screen">
        <ol class="boot__log" data-slot="boot-log"></ol>
        <p class="boot__ready" data-slot="boot-ready"></p>
      </div>
    </div>

    <main id="main">
      <!-- SLOT: hero: the team, not any one event -->
      <section id="hero" class="section section--hero" data-section="hero">
        <div class="container hero__inner">
          <h1 class="hero__headline" data-slot="headline" data-fill="hero.headline"></h1>
          <p class="hero__sub" data-fill="hero.sub"></p>
          <dl class="hero__stats" data-fill="hero.stats"></dl>
          <div class="hero__ctas" data-fill="hero.ctas"></div>
        </div>
      </section>

      <!-- SLOT: hackathons: one equal card per event, newest first -->
      <section id="hackathons" class="section section--hackathons" data-section="hackathons">
        <div class="container">
          <div class="section__heading">
            <h2 class="section__title" data-fill="hackathons.heading"></h2>
            <p class="section__sub" data-fill="hackathons.sub"></p>
          </div>
          <div class="hackathons__grid" data-fill="hackathons.cards"></div>
        </div>
      </section>

      <!-- SLOT: team: who we are and what each of us entered -->
      <section id="team" class="section section--team" data-section="team">
        <div class="container">
          <div class="section__heading">
            <h2 class="section__title" data-fill="team.heading"></h2>
            <p class="section__sub" data-fill="team.sub"></p>
          </div>
          <div class="team__grid" data-fill="team.roster"></div>
        </div>
      </section>

      <!-- SLOT: contact — two doors + form -->
      <section id="contact" class="section section--contact" data-section="contact">
        <div class="container">
          <div class="section__heading">
            <h2 class="section__title" data-fill="contact.heading"></h2>
            <p class="section__sub" data-fill="contact.sub"></p>
          </div>
          <div class="contact__inner">
            <div class="contact__info" data-fill="contact.info"></div>
            <!-- Native POST to the form service: action and hidden fields are
                 set by script.js from SITE_CONFIG.contact. novalidate is
                 deliberately NOT set, so the browser enforces the required
                 fields natively. -->
            <form class="contact__form" data-slot="contact-form" data-fill="contact.fields">
              <!-- fields injected by script.js from config.contact.fields -->
            </form>
          </div>
        </div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="i18n.js"></script>
    <script src="chrome.js"></script>
    <!-- motion.js defines window.SiteMotion, which script.js's boot() consumes.
         It must load first, or the boot has to guard for a missing API. -->
    <script src="motion.js"></script>
    <script src="script.js"></script>
  </body>
</html>
